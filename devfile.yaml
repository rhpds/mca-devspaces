schemaVersion: 2.2.0
metadata:
  name: dls-devspaces
components:
  - name: mta-dev-container
    container:
      image: quay.io/sshaaf/dls-devspaces:latest
      memoryLimit: 10Gi
      # Same as image ENV; set here so the devfile is self-describing in Dev Spaces and matches Che docs.
      env:
        - name: DEFAULT_EXTENSIONS
          value: /opt/vscode-extensions/redhat-java-extension-linux-x64.vsix;/opt/vscode-extensions/mta-vscode-extension-core.vsix;/opt/vscode-extensions/mta-vscode-extension-java.vsix
