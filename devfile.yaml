schemaVersion: 2.2.0
metadata:
  name: mta-development-env
  version: 1.2.0
  display-name: MTA & Java Development
  description: Optimized study environment with forced IDE preferences

attributes:
  # Focuses the Explorer sidebar on the primary project
  vscode-projects:
    - coolstore

projects:
  - name: coolstore
    git:
      remotes:
        origin: https://github.com/sshaaf/coolstore.git
  - name: inventory-management
    git:
      remotes:
        origin: https://github.com/savitharaghunathan/inventory_management.git
  - name: ehr-viewer
    git:
      remotes:
        origin: https://github.com/hhpatel14/ehr_viewer.git

components:
  - name: mta-dev-container
    attributes:
      # These preferences are injected directly into the IDE's machine settings
      preferences:
        workbench.colorTheme: "Default Light Modern"
        java.server.launchMode: "Standard"
        java.autobuild.enabled: false
        java.import.maven.enabled: true
        editor.codeLens: false
        editor.minimap.enabled: false
        java.jdt.ls.vmargs: "-Xmx2G -XX:+UseG1GC"
        redhat.telemetry.enabled: false
        java.compile.nullAnalysis.mode: false
      vscode-extensions:
        - redhat.java
        - redhat.mta-vscode-extension-core
        - redhat.mta-vscode-extension-java
    container:
      image: quay.io/sshaaf/dls-devspaces:latest
      memoryLimit: 10Gi
      sourceMapping: /projects
      mountSources: true
      env:
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-17-openjdk
        - name: M2_HOME
          value: /usr/share/maven

commands:
  - id: setup-mta-global-settings
    exec:
      component: mta-dev-container
      commandLine: |
        TARGET_DIR="/checode/remote/data/User/globalStorage/redhat.mta-core/settings"
        # Using the raw URL to avoid getting HTML instead of YAML
        RAW_URL="https://raw.githubusercontent.com/sshaaf/dls-devspaces/devfile-test/provider-settings.yaml"
        echo "⏳ Injecting MTA provider settings..."
        mkdir -p "$TARGET_DIR"
        # -f fails on 404, -L follows redirects, -s is silent
        curl -fLs "$RAW_URL" -o "$TARGET_DIR/provider-settings.yaml"
        if [ $? -eq 0 ]; then
          echo "✅ provider-settings.yaml successfully pulled via curl."
        else
          echo "❌ Failed to pull provider-settings.yaml. Check the URL or network."
        fi
  - id: create-workspace-file
    exec:
      component: mta-dev-container
      commandLine: |
        cat <<EOF > /projects/.code-workspace
        {
          "folders": [
            { "name": "coolstore", "path": "/projects/coolstore" },
          ],
          "settings": {
            "java.compile.nullAnalysis.mode": "automatic"
          }
        }
        EOF
        echo "✅ Multi-root workspace file created."

  - id: wait-for-java
    exec:
      component: mta-dev-container
      commandLine: |
        echo "⏳ Step 1: Waiting for Workspace Storage..."
        COUNT=0
        until [ -d "$HOME/.vscode-remote/data/User/workspaceStorage" ] || [ $COUNT -eq 30 ]; do
          sleep 2
          COUNT=$((COUNT+1))
        done
        echo "⏳ Step 2: Waiting for Java LSP process..."
        COUNT=0
        until pgrep -f "org.eclipse.jdt.ls.product" > /dev/null || [ $COUNT -eq 30 ]; do
          sleep 2
          COUNT=$((COUNT+1))
        done
        echo "✅ Java Environment is fully initialized!"

  - id: build-coolstore
    exec:
      component: mta-dev-container
      workingDir: /projects/coolstore
      commandLine: mvn clean install
      group:
        kind: build
        isDefault: true

  - id: build-inventory
    exec:
      component: mta-dev-container
      workingDir: /projects/inventory-management
      commandLine: mvn clean install
      group:
        kind: build

  - id: build-ehr
    exec:
      component: mta-dev-container
      workingDir: /projects/ehr-viewer
      commandLine: mvn clean install
      group:
        kind: build

events:
  # Ensures the workspace doesn't finish loading until the script exits
  postStart:
    - wait-for-java
    - create-workspace-file
    - setup-mta-global-settings
